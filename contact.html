<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroBoom | From Zero to Summit</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
            transition: font-family 0.3s ease;
        }

        body.fa {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* دکمه تغییر زبان */
        .lang-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 126, 234, 0.5);
            border-radius: 50px;
            padding: 8px 20px;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        body[dir="rtl"] .lang-switcher {
            right: auto;
            left: 20px;
        }

        .lang-switcher:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        /* منوی ناوبری */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 50px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(102, 126, 234, 0.3);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-menu {
            display: flex;
            gap: 35px;
            list-style: none;
        }

        .nav-menu a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s ease;
            position: relative;
            padding: 5px 0;
        }

        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #667eea 0%, #f093fb 100%);
            transition: width 0.3s ease;
        }

        .nav-menu a:hover::after {
            width: 100%;
        }

        .nav-menu a:hover {
            color: #f093fb;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            z-index: 20;
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;
            background: #ffffff;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .logo {
            font-size: 6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #667eea 75%, #764ba2 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 5s ease infinite, logoGlow 3s ease-in-out infinite;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.6)); }
            50% { filter: drop-shadow(0 0 40px rgba(118, 75, 162, 0.8)); }
        }

        .tagline {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .back-button {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.5);
            border-radius: 50px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; }
            .menu-toggle { display: flex; }
            .nav-menu {
                position: fixed;
                top: 0;
                right: -100%;
                width: 100%;
                height: 100vh;
                background: rgba(10, 10, 10, 0.95);
                backdrop-filter: blur(20px);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 40px;
                transition: right 0.4s ease;
            }
            .nav-menu.active { right: 0; }
            .nav-menu a { font-size: 1.5rem; }
            .logo { font-size: 4rem; }
            .tagline { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <!-- دکمه تغییر زبان -->
    <button class="lang-switcher" onclick="toggleLanguage()">
        <span class="flag">🌐</span>
        <span id="langText">فارسی</span>
    </button>

    <!-- منوی ناوبری -->
    <nav class="navbar">
        <a href="index.html" class="nav-logo">ZeroBoom</a>
        
        <div class="menu-toggle" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <ul class="nav-menu" id="navMenu">
            <li><a href="index.html" id="navHome">Home</a></li>
            <li><a href="#about" id="navAbout">About Us</a></li>
            <li><a href="#services" id="navServices">Services</a></li>
            <li><a href="#contact" id="navContact">Contact Us</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="logo">ZeroBoom</h1>
        <p class="tagline" id="tagline">From Zero to Summit</p>
        <a href="index.html" class="back-button" id="backBtn">← Back to Home</a>
    </div>

    <script>
        // ===== سیستم دوزبانه =====
        const translations = {
            en: {
                tagline: "From Zero to Summit",
                backBtn: "← Back to Home",
                langText: "فارسی",
                navHome: "Home",
                navAbout: "About Us",
                navServices: "Services",
                navContact: "Contact Us",
                dir: "ltr",
                lang: "en"
            },
            fa: {
                tagline: "از صفر تا بام",
                backBtn: "→ بازگشت به خانه",
                langText: "English",
                navHome: "خانه",
                navAbout: "درباره ما",
                navServices: "خدمات",
                navContact: "تماس با ما",
                dir: "rtl",
                lang: "fa"
            }
        };

        let currentLang = 'en';

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'fa' : 'en';
            const t = translations[currentLang];

            document.getElementById('tagline').textContent = t.tagline;
            document.getElementById('backBtn').textContent = t.backBtn;
            document.getElementById('langText').textContent = t.langText;
            document.getElementById('navHome').textContent = t.navHome;
            document.getElementById('navAbout').textContent = t.navAbout;
            document.getElementById('navServices').textContent = t.navServices;
            document.getElementById('navContact').textContent = t.navContact;
            document.documentElement.lang = t.lang;
            document.documentElement.dir = t.dir;

            if (currentLang === 'fa') {
                document.body.classList.add('fa');
            } else {
                document.body.classList.remove('fa');
            }

            localStorage.setItem('lang', currentLang);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('lang');
            if (savedLang && savedLang !== currentLang) {
                toggleLanguage();
            }
        });

        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('active');
        }

        document.querySelectorAll('.nav-menu a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navMenu').classList.remove('active');
            });
        });

        // ===== انیمیشن پس‌زمینه =====
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const orbCenter = {
            x: canvas.width * 0.35,
            y: canvas.height * 0.5
        };

        const particles = [];
        const particleCount = window.innerWidth < 768 ? 60 : 120;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.radius = Math.random() * 2 + 1;
                this.color = Math.random() > 0.5 ? 
                    `rgba(102, 126, 234, ${Math.random() * 0.5 + 0.3})` : 
                    `rgba(240, 147, 251, ${Math.random() * 0.5 + 0.3})`;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        let orbAngle = 0;
        function drawOrb() {
            orbAngle += 0.02;

            const gradient = ctx.createRadialGradient(
                orbCenter.x, orbCenter.y, 0,
                orbCenter.x, orbCenter.y, 120
            );
            gradient.addColorStop(0, 'rgba(102, 126, 234, 0.4)');
            gradient.addColorStop(0.5, 'rgba(118, 75, 162, 0.2)');
            gradient.addColorStop(1, 'rgba(102, 126, 234, 0)');

            ctx.beginPath();
            ctx.arc(orbCenter.x, orbCenter.y, 120, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(orbCenter.x, orbCenter.y, 80, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(102, 126, 234, 0.5)';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(orbCenter.x, orbCenter.y, 90, orbAngle, orbAngle + Math.PI);
            ctx.strokeStyle = 'rgba(240, 147, 251, 0.7)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(orbCenter.x, orbCenter.y, 95, orbAngle + Math.PI, orbAngle + Math.PI * 2);
            ctx.strokeStyle = 'rgba(102, 126, 234, 0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawCurvedLines() {
            particles.forEach((particle, index) => {
                if (index % 2 === 0) {
                    const dx = particle.x - orbCenter.x;
                    const dy = particle.y - orbCenter.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 350) {
                        ctx.beginPath();
                        ctx.moveTo(orbCenter.x, orbCenter.y);
                        const cpX = (orbCenter.x + particle.x) / 2 + Math.sin(Date.now() * 0.001 + index) * 30;
                        const cpY = (orbCenter.y + particle.y) / 2 + Math.cos(Date.now() * 0.001 + index) * 30;
                        ctx.quadraticCurveTo(cpX, cpY, particle.x, particle.y);
                        ctx.strokeStyle = `rgba(102, 126, 234, ${0.3 * (1 - distance / 350)})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            });
        }

        function drawNetwork() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 150) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(102, 126, 234, ${0.2 * (1 - distance / 150)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawOrb();
            drawCurvedLines();
            drawNetwork();

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            orbCenter.x = canvas.width * 0.35;
            orbCenter.y = canvas.height * 0.5;
        });
    </script>
</body>
</html>
