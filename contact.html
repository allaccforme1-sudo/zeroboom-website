<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroBoom | From Zero to Summit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .logo {
            font-size: 6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #667eea 75%, #764ba2 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 5s ease infinite, logoGlow 3s ease-in-out infinite;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.6)); }
            50% { filter: drop-shadow(0 0 40px rgba(118, 75, 162, 0.8)); }
        }

        .tagline {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .back-button {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.5);
            border-radius: 50px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .logo { font-size: 4rem; }
            .tagline { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <h1 class="logo">ZeroBoom</h1>
        <p class="tagline">From Zero to Summit</p>
        <a href="index.html" class="back-button">← Back to Home</a>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // مرکز دایره نورانی (سمت چپ)
        const orbCenter = {
            x: canvas.width * 0.35,
            y: canvas.height * 0.5
        };

        // ذرات شبکه
        const particles = [];
        const particleCount = window.innerWidth < 768 ? 60 : 120;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.radius = Math.random() * 2 + 1;
                this.color = Math.random() > 0.5 ? 
                    `rgba(102, 126, 234, ${Math.random() * 0.5 + 0.3})` : 
                    `rgba(240, 147, 251, ${Math.random() * 0.5 + 0.3})`;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // رسم دایره نورانی چرخان
        let orbAngle = 0;
        function drawOrb() {
            orbAngle += 0.02;

            // افکت درخشش
            const gradient = ctx.createRadialGradient(
                orbCenter.x, orbCenter.y, 0,
                orbCenter.x, orbCenter.y, 120
            );
            gradient.addColorStop(0, 'rgba(102, 126, 234, 0.4)');
            gradient.addColorStop(0.5, 'rgba(118, 75, 162, 0.2)');
            gradient.addColorStop(1, 'rgba(102, 126, 234, 0)');

            ctx.beginPath();
            ctx.arc(orbCenter.x, orbCenter.y, 120, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // دایره اصلی
            ctx.beginPath();
            ctx.arc(orbCenter.x, orbCenter.y, 80, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(102, 126, 234, 0.5)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // دایره چرخان
            ctx.beginPath();
            ctx.arc(orbCenter.x, orbCenter.y, 90, orbAngle, orbAngle + Math.PI);
            ctx.strokeStyle = 'rgba(240, 147, 251, 0.7)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(orbCenter.x, orbCenter.y, 95, orbAngle + Math.PI, orbAngle + Math.PI * 2);
            ctx.strokeStyle = 'rgba(102, 126, 234, 0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // رسم خطوط منحنی از دایره به ذرات
        function drawCurvedLines() {
            particles.forEach((particle, index) => {
                if (index % 2 === 0) {
                    const dx = particle.x - orbCenter.x;
                    const dy = particle.y - orbCenter.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 350) {
                        ctx.beginPath();
                        ctx.moveTo(orbCenter.x, orbCenter.y);
                        
                        const cpX = (orbCenter.x + particle.x) / 2 + Math.sin(Date.now() * 0.001 + index) * 30;
                        const cpY = (orbCenter.y + particle.y) / 2 + Math.cos(Date.now() * 0.001 + index) * 30;
                        
                        ctx.quadraticCurveTo(cpX, cpY, particle.x, particle.y);
                        ctx.strokeStyle = `rgba(102, 126, 234, ${0.3 * (1 - distance / 350)})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            });
        }

        // رسم خطوط شبکه
        function drawNetwork() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 150) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(102, 126, 234, ${0.2 * (1 - distance / 150)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        // حلقه انیمیشن
        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // رسم دایره نورانی
            drawOrb();

            // رسم خطوط منحنی
            drawCurvedLines();

            // رسم شبکه ذرات
            drawNetwork();

            // رسم و به‌روزرسانی ذرات
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            orbCenter.x = canvas.width * 0.35;
            orbCenter.y = canvas.height * 0.5;
        });
    </script>
</body>
</html>
